name: Release

# Every commit that lands on main packs signed .crx files for Chrome and Edge
# and publishes them as a GitHub Release. Work happens on `develop`; main is
# protected and advances only through a pull request, so this fires once per
# develop -> main merge.
#
# NOTHING here writes to main. That is deliberate and not merely tidy: GitHub
# will not grant github-actions[bot] push access to a protected branch — the
# classic `restrictions.apps` list silently drops it, and a ruleset bypass actor
# is refused with "GitHub Actions integration must be part of the ruleset source
# or owner organization". Any design where CI pushes to main therefore needs a
# PAT or GitHub App token, i.e. another long-lived secret that expires.
#
# So the version is NOT bumped here. main is published exactly as it stands,
# which keeps package.json, the tag and the artifact filenames in agreement, and
# the next development version is opened on `develop` afterwards — develop is
# unprotected, so the bot can push there. The practical consequence: a
# develop -> main merge must carry a version not already tagged, which the
# "Read version to publish" step enforces rather than discovering halfway
# through a publish.
#
# Two guards decide whether this runs at all, both on the `verify` job and
# inherited by `release` via `needs:`:
#
#   1. Repository guard. This file is pushed to BOTH remotes, but only the
#      private repo holds CRX_SIGNING_KEY_PEM. Without the guard, every push to
#      the public mirror would fail this workflow on a missing secret, and a
#      permanently red mirror trains people to ignore red. It simply does not
#      run there.
#   2. Skip marker. The version bump below is itself a push to main, which would
#      retrigger this workflow and bump again, forever. The bump commit carries
#      [skip ci] and is filtered here.
#
# ACTIONS ALLOWLIST: see the note in ci.yml. Chrome is located on the runner
# rather than installed by an action, because browser-actions/setup-chrome is
# not permitted by org policy.

on:
  push:
    branches: [main]

# Never let two releases interleave — they would race on the version bump and
# could publish the same tag twice. Unlike CI, an in-flight release is NOT
# cancelled: it may already have pushed a bump or created a tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump, create the tag and the release

jobs:
  # Same gate as a PR. A commit reaching main should already be green, but "should
  # be" is not a reason to sign and publish an unverified artifact.
  verify:
    if: >-
      github.repository == 'kkpfg-kkpb/tool-jira-time-logger' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    uses: ./.github/workflows/ci.yml

  release:
    name: Bump, pack, publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN credentials are kept so the bump can be pushed
          # back. Note this means the push is attributed to github-actions[bot].
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pinned by `packageManager` in package.json. Not corepack — it is being
      # removed from Node (already absent in v26). See the note in ci.yml.
      - name: Install pnpm (version pinned by package.json)
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm --version

      - run: pnpm install --frozen-lockfile

      # pack:crx shells out to a real Chrome binary for CRX3 packing. The ubuntu
      # runner images ship Chrome, but that is an image detail rather than a
      # guarantee, so locate it explicitly and fall back to installing Chromium.
      # Failing here with a clear message beats failing inside pack:crx.
      - name: Locate a Chrome binary
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$c" ]; then
              echo "CHROME_PATH=$c" >> "$GITHUB_ENV"
              echo "Using $c — $("$c" --version 2>&1 | head -1)"
              exit 0
            fi
          done
          echo "No preinstalled Chrome found; installing chromium-browser."
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser
          for c in /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$c" ]; then
              echo "CHROME_PATH=$c" >> "$GITHUB_ENV"
              echo "Using $c — $("$c" --version 2>&1 | head -1)"
              exit 0
            fi
          done
          echo "::error::Could not find or install a Chrome/Chromium binary; pack:crx cannot sign without one."
          exit 1

      # Written via env, not `${{ }}` interpolation into the script body, so the
      # key cannot be shell-interpreted. Created 0600 BEFORE the write so it is
      # never briefly world-readable. GitHub strips trailing newlines from
      # secrets; openssl wants one back.
      - name: Materialise signing key
        env:
          SIGNING_KEY_PEM: ${{ secrets.CRX_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$SIGNING_KEY_PEM" ]; then
            echo "::error::CRX_SIGNING_KEY_PEM is empty or unset. See docs/release.md."
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/signing.pem"
          printf '%s\n' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/signing.pem"
          echo "CRX_SIGNING_KEY=$RUNNER_TEMP/signing.pem" >> "$GITHUB_ENV"

      # The whole point of manifest.key is that ONE key yields ONE extension id
      # and therefore one registered OAuth callback URL. A wrong or corrupted
      # secret would still pack successfully — just under a different id, whose
      # only symptom is users failing to authenticate after install. ext:id
      # compares the secret against the key pinned in wxt.config.ts; anything
      # but OK stops the release before anything is published.
      - name: Verify signing key matches the pinned extension id
        run: |
          OUT="$(pnpm ext:id)"
          echo "$OUT"
          # Whitespace-tolerant on purpose — the exact column the script pads to
          # is not a contract worth breaking a release over.
          if ! echo "$OUT" | grep -qE 'Pin status:[[:space:]]+OK'; then
            echo "::error::Signing key does not match the key pinned in wxt.config.ts. Refusing to publish under a different extension id."
            exit 1
          fi

      # Publish whatever version main already carries. Nothing is bumped here,
      # so main's package.json, the tag, and the artifact filenames always agree
      # — and main is never written to, which is what lets it stay protected.
      - name: Read version to publish
        id: bump
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists — main was merged without a version bump on develop. Bump the version on develop and merge again."
            exit 1
          fi

      - name: Pack signed .crx (Chrome + Edge)
        run: pnpm pack:crx

      # Tags are not branches: branch protection does not apply to them, so the
      # bot can push this even though it cannot push to main itself.
      - name: Tag the released commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # gh is preinstalled on the runner and is not an action, so it sidesteps
      # the allowlist entirely.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" \
            "jira-time-logger-$VERSION.crx" \
            "jira-time-logger-edge-$VERSION.crx" \
            --title "v$VERSION" \
            --notes "Signed sideload builds for Chrome and Edge, extension id \`npebpnfjmeehmaeekloeiicbkldggmmb\`.

          Install: download the .crx and drag it onto \`chrome://extensions\` (or \`edge://extensions\`) with Developer mode enabled.

          Built from $SHA."

      # Open the next development cycle on develop, which is unprotected and so
      # CAN be pushed to. Skipped when develop has already moved past the
      # released version — someone bumping by hand should not be clobbered.
      - name: Prepare next development version on develop
        env:
          RELEASED: ${{ steps.bump.outputs.version }}
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$RELEASED" ]; then
            echo "develop is on $CURRENT, released $RELEASED — already moved on, leaving it alone."
            exit 0
          fi
          npm version patch --no-git-tag-version
          NEXT="$(node -p "require('./package.json').version")"
          # [skip ci] keeps a version-only commit from spending a CI run.
          git commit -am "Prepare next development version $NEXT [skip ci]"
          git push origin develop
          echo "develop opened on $NEXT"
