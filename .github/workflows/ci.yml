name: CI

# Runs on every PR and every push to main. Deliberately references NO secrets,
# so it is safe on the public mirror (panitw/jira-time-logger) as well as the
# private repo — a fork PR can run this and gain nothing.
#
# Also exposed via `workflow_call` so release.yml can reuse it as its gate
# instead of duplicating the commands. There is exactly one definition of "does
# this build".
#
# ACTIONS ALLOWLIST: the kkp org runs `allowed_actions: selected` with
# `github_owned_allowed: false`, so only explicitly-listed actions may be used.
# `actions/checkout@v4` and `actions/setup-node@v4` are listed;
# `pnpm/action-setup` and `actions/cache` are NOT. Hence pnpm is installed from
# the `packageManager` pin and there is no dependency cache. Adding an action
# that is not on the
# allowlist does not fail the run — the workflow silently never triggers at all,
# which is a genuinely confusing failure mode. Check the policy before adding
# one:
#   gh api repos/kkpfg-kkpb/tool-jira-time-logger/actions/permissions/selected-actions

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A superseded PR push has nothing worth finishing; cancel it. Keyed by ref so
# main and each PR queue independently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Installs the EXACT pnpm pinned by `packageManager` in package.json, so
      # CI and local can never drift — the same guarantee pnpm/action-setup
      # gives, without needing an action the allowlist forbids.
      #
      # Deliberately not corepack: it is being removed from Node (already absent
      # in v26), so `corepack enable` would keep working until a routine Node
      # bump silently broke every workflow.
      - name: Install pnpm (version pinned by package.json)
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm --version

      # --frozen-lockfile makes a stale lockfile a build failure rather than a
      # silent re-resolve. That matters here: pnpm-workspace.yaml pins security
      # overrides, and a quiet re-resolve could drop them.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Both targets — the Edge build has caught manifest issues the Chrome one
      # did not, and release.yml packs both.
      - name: Build (Chrome)
        run: pnpm build

      - name: Build (Edge)
        run: pnpm build:edge

      # Cheap regression guard for the advisory work: fails if a dependency
      # change reintroduces a vulnerability in anything that ships.
      - name: Audit (production dependencies)
        run: pnpm audit --prod
