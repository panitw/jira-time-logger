# pnpm settings. This file exists even though we are not a workspace: as of
# pnpm 10 the `pnpm` field in package.json is no longer read, and `overrides`
# lives here instead. Putting them in package.json still *appears* to work,
# because `pnpm install` bakes the resolutions into pnpm-lock.yaml — but pnpm
# prints "the pnpm field ... is ignored" and the overrides silently disappear
# the moment anything forces a fresh resolve.
#
# Every override below is a build/test-only transitive that one of our direct
# devDependencies still pins to a vulnerable range. None of them reach the
# shipped extension bundle — `pnpm audit --prod` is clean with or without this
# file. They exist so the audit report stays short enough to actually read,
# instead of burying a real finding under known-unreachable noise.
#
# Majors are scoped separately (brace-expansion, vite) so a consumer expecting
# the old major is not silently handed a breaking one.
#
# `pnpm audit` currently reports zero advisories at every severity. Treat a
# regression here as a real signal rather than background noise — that is the
# whole point of having driven it to zero.
#
# An override is only acceptable here if the forced version ACTUALLY WORKS with
# the package that pinned the old one. Quieting the scanner by installing a
# combination that would crash on use is worse than the advisory, because the
# report then reads clean while the tree is broken. Two were rejected on exactly
# that basis and are NOT listed below:
#   minimatch@3 -> 10   multimatch@6 does `import minimatch from 'minimatch'`
#                       and minimatch 10 exports no default; it dies at import.
#                       Bumping multimatch to 8 fixes the same chain properly.
#   brace-expansion -> 5 as a single blanket entry. minimatch@3 calls the module
#                       as a bare function, but 5.x's CJS build does not export
#                       one, so ESLint died with "expand is not a function".
#                       Hence the per-major scoping below.
# Each remaining entry was verified by exercising the dependent's real call
# path, not by assuming semver compatibility. See the notes on each.
overrides:
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@>=3: ^5.0.8
  js-yaml@4: ^4.3.0
  ws@8: ^8.21.0
  form-data@4: ^4.0.6
  postcss@8: ^8.5.18
  tmp@0: ^0.2.6
  shell-quote@1: ^1.9.0
  adm-zip@0: ^0.6.0
  vite@8: ^8.0.16
  # node-notifier@10 pins uuid ^8, but its only use is
  # `const { v4 } = require('uuid')` in notifiers/toaster.js — a shape uuid 11
  # still exports. Verified by resolving uuid from toaster.js's own require
  # context and calling v4(), not by assuming the majors are compatible.
  uuid@8: ^11.1.1
  # The last brace-expansion holdout. web-ext-run pins multimatch 6.0.0, which
  # pins minimatch ^3, which pins brace-expansion ^1 — and that advisory's
  # vulnerable range (<=5.0.7) spans EVERY major, so no 1.x release satisfies
  # it. Overriding minimatch under multimatch 6 does not work: multimatch 6 does
  # `import minimatch from 'minimatch'` and minimatch 10 has no default export,
  # so it dies at import. Bumping multimatch itself does work — 8.0.0 depends on
  # minimatch ^10.2.2, which carries the patched brace-expansion.
  # web-ext-run's only call site is `multimatch(resolvedPath, filesToIgnore)` in
  # lib/util/file-filter.js:86, passing a STRING rather than an array; verified
  # multimatch 8 still accepts that and still returns a non-empty array for an
  # ignored path and an empty one for a wanted path, which is the entire
  # contract wantFile() depends on.
  multimatch@6: ^8.0.0
  # vite 8.1.5 declares esbuild as an OPTIONAL PEER with range
  # `^0.27.0 || ^0.28.0`, so moving to the patched 0.28.1 is inside what vite
  # already supports — this is picking an allowed version, not forcing one.
  esbuild@0.27: ^0.28.1
