<!--
  Extension icon — small-size artwork (16 / 32 px).

  Same tile and palette as icon.svg, but the check is dropped and the dial
  is enlarged and thickened. At 16px a 9-unit stroke lands on ~1.1 device
  pixels and the hands smear into the ring; 12 units lands on ~1.5 and the
  hands stay separated. The check knockout is below the raster floor at
  this size, so it is omitted rather than rendered as a smudge.

  Chrome picks 16 for the extensions menu and 32 for the toolbar on 2x
  displays — these two sizes carry the icon's everyday legibility.

  Regenerate the PNGs with `pnpm icons` after editing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#665c88" />
      <stop offset="1" stop-color="#4a4163" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#tile)" />

  <circle cx="64" cy="64" r="37" fill="none" stroke="#ffffff" stroke-width="12" />
  <path
    d="M64 42 V64 H84"
    fill="none"
    stroke="#ffffff"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
